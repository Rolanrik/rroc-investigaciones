name: Investigacion nocturna Rroc

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      tema:
        description: 'Tema manual (opcional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Investigar con Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TEMA_MANUAL: ${{ inputs.tema }}
        run: python3 investigar.py
      - name: Publicar resultados
        run: |
          git config user.name "rroc-bot"
          git config user.email "rroc-bot@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "Investigacion $(date -u +%F)"
          git push
